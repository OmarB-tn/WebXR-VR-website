<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR Operator Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; padding: 24px; max-width: 720px; margin: auto; }
    .slot { background: #1f2937; border-radius: 10px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    button { background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:disabled { background: #374151; cursor: not-allowed; }
    .note { color: #fbbf24; font-size: 0.9rem; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>VR Stations — Active Viewers (Max 3)</h1>
  <div id="kv-note" class="note" hidden>Note: Bind a KV namespace named VR_SESSIONS in Cloudflare Pages Settings to enforce the 3-station limit.</div>
  <div id="slots"></div>
  <script>
    async function refresh() {
      const res = await fetch('/api/admin/slots');
      const { slots, kvBound } = await res.json();
      document.getElementById('kv-note').hidden = kvBound;
      document.getElementById('slots').innerHTML = slots.map(s => `
        <div class="slot">
          <div>
            <strong>Station ${s.slot}:</strong>
            ${s.sessionId ? `Watching #${s.videoId} (${s.title})` : 'Available'}
          </div>
          <button ${s.sessionId ? '' : 'disabled'} onclick="release(${s.slot})">Release</button>
        </div>
      `).join('');
    }
    async function release(slot) {
      await fetch(`/api/admin/release/${slot}`, { method: 'POST' });
      refresh();
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
